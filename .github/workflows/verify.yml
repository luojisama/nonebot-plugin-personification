name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pdm install --prod

      - name: Compile package
        run: pdm run python -m compileall -q nonebot_plugin_personification

      - name: Smoke test plugin dependency load order
        run: pdm run python scripts/smoke_load_dependencies.py
