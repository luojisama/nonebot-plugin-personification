name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: pdm install -G dev

      - name: Compile package
        run: pdm run python -m compileall -q nonebot_plugin_personification tools tests

      - name: Run package tests
        run: mkdir -p .tmp && pdm run python -m pytest tests --basetemp .tmp/pytest

      - name: Run semantic scan
        run: pdm run python -m tools.personification_semantic_scan

      - name: Smoke test plugin dependency load order
        run: pdm run python scripts/smoke_load_dependencies.py

      - name: Smoke test legacy htmlrender degradation
        run: pdm run python scripts/smoke_load_dependencies.py --simulate-htmlrender-without-md-to-pic

      - name: Build package
        run: pdm build

      - name: Check WebUI JavaScript syntax
        shell: bash
        run: find nonebot_plugin_personification/webui/static -name '*.js' -print0 | xargs -0 -n1 node --check
