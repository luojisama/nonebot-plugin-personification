[project]
name = "nonebot-plugin-shiro-personification"
version = "0.7.0.post0"
description = "基于群聊与私聊上下文的人设回复插件，支持作息模拟、联网检索、风格学习、主动私聊、贴图、画像与 Agent 工具调用。"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "luojisama", email = "2534316454@qq.com" },
]
license = { text = "MIT" }
keywords = ["nonebot", "nonebot2", "plugin", "onebot", "personification", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "nonebot2[fastapi,httpx]>=2.4.4",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-htmlrender>=0.3.5",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot-plugin-uninfo>=0.11.0",
    "aiohttp>=3.10.0",
    "aiosqlite>=0.20.0",
    "ruamel.yaml>=0.18.0",
    "python-dateutil>=2.9.0",
    "Pillow>=10.4.0",
    "qrcode>=8.0,<9.0",
    "python-multipart>=0.0.20",
    "pillow-avif-plugin>=1.5.2",
    "cryptography>=42.0.0",
    "filelock>=3.13.1",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.30.0",
    "playwright>=1.50.0",
    "watchdog>=4.0.0",
    "aiofiles",
    "beautifulsoup4",
    "emoji",
    "imageio-ffmpeg",
    "msgspec",
    "yt-dlp",
    "fastapi>=0.95.0",
    "python-dotenv>=1.0.0",
    "pydantic",
    "httpx",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
"Homepage" = "https://github.com/luojisama/nonebot-plugin-personification"
"Bug Tracker" = "https://github.com/luojisama/nonebot-plugin-personification/issues"
"Repository" = "https://github.com/luojisama/nonebot-plugin-personification"

[tool.nonebot]
plugins = ["nonebot_plugin_personification"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
